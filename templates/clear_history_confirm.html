<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>検索履歴の全削除</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px 48px;
            color: #263238;
            background: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px;
            background: #ffffff;
            border: 1px solid #d9e0e6;
            border-radius: 4px;
        }

        h1 {
            margin: 0 0 24px;
            color: #1f2d3d;
            font-size: 28px;
            letter-spacing: 0;
        }

        p {
            margin: 0 0 16px;
        }

        .warning {
            color: #b71c1c;
            font-weight: 600;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            padding: 9px 20px;
            color: #ffffff;
            background: #c62828;
            border: 1px solid #c62828;
            border-radius: 3px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        button:hover {
            background: #a61f1f;
        }

        a {
            color: #1769aa;
            font-weight: 600;
        }

        a:hover {
            color: #0d4775;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 12px 36px;
            }

            main {
                padding: 18px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>検索履歴の全削除</h1>
        <p>本当にすべての検索履歴を削除しますか？</p>
        <p class="warning">この操作は元に戻せません。</p>

        <div class="actions">
            <form method="post" action="/history/clear">
                <button type="submit">すべて削除する</button>
            </form>
            <a href="/">戻る</a>
        </div>
    </main>
</body>
</html>
